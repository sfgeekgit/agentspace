<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><link rel="stylesheet" href="web.css"><link rel="stylesheet" href="mirror.css"><title>Run · Agent World Maker</title></head>
<body data-page="run" data-env="1"><div class="workspace"><main id="content">
<header class="watch-header"><div class="watch-topline"><div class="breadcrumbs"><a href="./">← Environments</a><a id="scenario-link"></a></div>
<span class="mirror-asof"><span class="as-of">…</span> <button class="small refresh">Refresh</button></span></div>
<div class="watch-heading"><h1 id="title">…</h1><span id="status"></span><span id="subtitle" class="muted"></span></div>
<div id="facts" class="watch-facts"></div><div id="lineage" class="lineage" aria-label="Lineage"></div><p id="coverage" class="mirror-coverage muted"></p></header>
<div class="watch-layout"><aside id="agents" aria-label="Agents"><h2>Agents <span id="agent-count"></span></h2><div id="agent-cards"></div></aside>
<section class="watch-main" aria-label="Logs"><div class="watch-tabs"><div id="views" role="tablist" aria-label="Log views"></div>
<label class="watch-playback"><span class="sr-only">Mode</span><select id="mode"><option value="latest">Latest</option><option value="replay">Replay</option></select></label></div>
<div class="watch-log-tools"><label class="watch-filter"><span class="sr-only">Filter visible events</span><input id="log-filter" type="search" placeholder="Filter this view…"></label>
<button id="earlier" class="text-button" hidden>Load earlier</button><span class="push-right mirror-downloads">Download this view: <a id="dl-txt" class="text-link">.txt</a> <a id="dl-jsonl" class="text-link">.jsonl</a></span></div>
<div id="replay-tools" class="watch-log-tools" hidden><button id="play" class="small">Play</button>
<label class="mirror-inline">Speed <select id="speed"><option>1</option><option>2</option><option>5</option><option selected>10</option><option>30</option></select>×</label>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position in the run">
<label class="mirror-inline">Skip gaps over <input id="gap" type="number" min="1" value="30"> s</label><span id="clock" class="muted"></span></div>
<div id="log-panel" role="tabpanel"><div id="pane" tabindex="0" role="log" aria-label="Events"></div></div>
<div class="watch-stream-status"><span id="live"></span><span id="event-count"></span></div></section>
<aside id="side" aria-label="Budget, results and downloads"><section class="watch-budget"><h2>Shared budget</h2><div id="budget"><b>…</b><div class="bar"><div></div></div><small></small></div></section>
<section id="results" class="mirror-side"><h2>Results</h2><p id="game" class="muted"></p><button id="generate" class="small" hidden>Generate results</button><div id="result-files"><p class="muted">No results have been generated for this environment.</p></div></section>
<section class="mirror-side"><h2>Download</h2><a id="dl-all" class="button secondary small" href="#">Everything (.zip)</a></section></aside></div>
</main></div><script src="mirror.js"></script></body></html>
